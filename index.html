<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141714">
<title>Hyrox 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b1f1c; --muted:#5f6862; --line:#d9ddd6; --soft:#eceee9;
  --accent:#f2c200; --accent-ink:#1b1f1c; --olive:#4d5a3a; --ok:#2f7a4a; --warn:#b5651d; --bad:#c0392b;
  --t-agm:#6b7280; --t-fuerza:#8a4b16; --t-carrera:#1f6f8b; --t-aerobico:#2f7a4a; --t-hyrox:#a07d00; --t-rec:#6a5a8c; --t-desc:#8b938d; --t-man:#4d5a3a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --navh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141714; --surface:#1c201c; --ink:#e9ece6; --muted:#9aa39c; --line:#2f352f; --soft:#232823;
  --accent:#f2c200; --accent-ink:#141714; --olive:#a9b98c; --ok:#5fbf82; --warn:#e3995a; --bad:#ff6b5b;
  --t-agm:#a3a9b3; --t-fuerza:#e09a5f; --t-carrera:#6cc0dd; --t-aerobico:#6fcf93; --t-hyrox:#f2c200; --t-rec:#b8a7e0; --t-desc:#8b938d; --t-man:#a9b98c; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:64px;overflow-x:clip;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
html,body{width:100%;max-width:100vw;overscroll-behavior-x:none}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 24px)}
header{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;flex:1}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 6px;margin-right:6px}
#bMenu{position:relative;background:none;border:0;color:inherit;padding:4px 2px;cursor:pointer;display:flex}
#bMenu svg{width:26px;height:26px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#bMenu.pend::after{content:"";position:absolute;top:3px;right:0;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu{position:fixed;inset:0;z-index:9;background:rgba(10,12,10,.55);display:none}
.menu.on{display:block}
.menu .pan{position:absolute;top:0;right:0;width:min(78vw,300px);height:100%;background:var(--surface);color:var(--ink);padding:max(16px,env(safe-area-inset-top)) 0 16px;box-shadow:-12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column}
.menu .pan h3{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0 18px 10px}
.menu .pan button{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:14px 18px;text-align:left;cursor:pointer}
.menu .pan button:last-of-type{border-bottom:1px solid var(--line)}
.menu .pan .st2{font-family:var(--mono);font-size:12px;color:var(--muted);margin:14px 18px 0}
#sync.pend{color:var(--warn)}
/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav.tabs button{background:none;border:0;color:var(--ink);opacity:.5;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;cursor:pointer;min-width:0;position:relative;transition:opacity .2s;white-space:nowrap;overflow:hidden}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{opacity:1}
nav.tabs button[aria-selected=true]::before{content:"";position:absolute;top:6px;width:18px;height:2px;background:var(--accent)}
.view[hidden]{display:none!important}
.wrapv,main,.nav,.week{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.wrapv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
h1.vt{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:.95;margin:4px 0 0}
h3.st{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:6px 0 -4px}
.card{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:8px}
.nav button{font-family:var(--mono);font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:6px 12px;cursor:pointer}
.nav .d{text-align:center;font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;line-height:1.05}
.nav .d small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);text-transform:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:12px}
.week button{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:4px 0;cursor:pointer;line-height:1.25}
.week button b{display:block;font-family:var(--display);font-size:19px;line-height:1}
.week button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week button.hoy{outline:2px solid var(--accent);outline-offset:-2px}
.week button.log::after{content:"";display:block;height:4px;background:var(--ok);margin:3px 6px 0}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.dayhead{grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);padding:10px 12px;display:grid;gap:6px}
.dayhead .f{font-weight:600}
.dayhead .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.why{font-family:var(--mono);font-size:11.5px;background:transparent;border:1px solid var(--ink);color:var(--ink);padding:3px 9px;cursor:pointer}
.why:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ses{grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));padding:10px 12px;display:grid;gap:8px}
.ses .sh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mm{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.ses h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.1}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--ok);color:var(--ok);padding:0 6px}
.t-agm{--c:var(--t-agm)}.t-fuerza{--c:var(--t-fuerza)}.t-carrera{--c:var(--t-carrera)}.t-aerobico{--c:var(--t-aerobico)}
.t-hyrox{--c:var(--t-hyrox)}.t-recuperacion{--c:var(--t-rec)}.t-descanso{--c:var(--t-desc)}.t-maniobras{--c:var(--t-man)}
.nt{font-size:13px;color:var(--muted)}
.sd{font-size:14px}
.ex{border-top:1px solid var(--line);padding-top:8px}
.exh{display:flex;gap:8px;align-items:baseline;width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:0;font:inherit;cursor:pointer}
.exh .nm{font-weight:600}
.exh .pl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:55%}
.exh .nm{min-width:0}
.exh .pl.ok{color:var(--ok)}
.ex.static .exh{cursor:default}
.pl2{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.last{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:4px 8px;margin-top:6px}
.last b{font-weight:500;color:var(--olive)}
.regla{font-size:13px;border-left:3px solid var(--accent);background:var(--soft);padding:4px 8px;margin-top:6px}
.regla.c{border-left-color:var(--warn)}
.rows{margin-top:8px}
.row{display:grid;grid-template-columns:22px 1fr 1fr 64px 42px;gap:6px;align-items:center;margin:5px 0}
.row .n{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.row label{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 6px;border-radius:0;width:100%;min-width:0}
.row input.chg{border-color:var(--warn);background:var(--soft)}
input.mal{border-color:var(--bad);outline:1px solid var(--bad)}
.row .rpe{text-align:center}
.row .ck{height:38px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:19px;cursor:pointer}
.row.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.row.extra .n{color:var(--warn)}
.btns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.hecha{justify-self:start;font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 10px;cursor:pointer}.hecha.on{border-color:var(--ok);color:var(--ok)}
.btns button{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px 10px;cursor:pointer}
.fin{border-top:2px solid var(--ink);padding-top:10px;display:grid;gap:8px}
.fin .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.fin .r input{width:80px;text-align:center}
textarea{min-height:60px;resize:vertical}
.pri{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border:0;padding:11px;width:100%;cursor:pointer}
.state{font-family:var(--mono);font-size:12px}.state.ok{color:var(--ok)}.state.pend{color:var(--warn)}
.cond{background:var(--soft);padding:6px 10px;font-size:13px}
.list{margin:4px 0 0;padding-left:18px;font-size:14px}.list li{margin:2px 0}
.empty{background:var(--surface);border:1px dashed var(--line);padding:24px;color:var(--muted);text-align:center}
/* perfil */
.cover{margin:-12px calc(-1*max(14px,env(safe-area-inset-left))) 0;height:calc(100svh - 52px - var(--navh) - env(safe-area-inset-bottom));min-height:420px;background:radial-gradient(ellipse at 50% 40%,#2a3322 0%,#141714 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:0;position:sticky;top:var(--hh,52px);align-self:start}
.cover > img{height:72%;max-width:92%;align-self:flex-end;margin-bottom:34px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(169,185,140,.25))}
.cover .cn{z-index:2;position:absolute;left:16px;right:16px;top:14px;font-family:var(--display);font-weight:800;font-size:clamp(72px,24vw,130px);text-transform:uppercase;color:#e9ece6;line-height:.85;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6);will-change:transform,opacity;pointer-events:none}
.cover .cn small{display:block;font-family:var(--mono);font-size:13px;font-weight:500;color:#f2c200;letter-spacing:.1em;margin-top:10px;text-shadow:none}
.cover .down{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:#a9b98c;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.cover.vacia > img{display:none}
.mus{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.mus .bar{height:10px}.mus .bar i{background:linear-gradient(90deg,var(--olive),var(--accent))}
.mus span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
details.hist>summary,details.adj>summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;color:var(--muted)}
details.hist>summary::-webkit-details-marker,details.adj>summary::-webkit-details-marker{display:none}
details.hist>summary::before,details.adj>summary::before{content:"▸ "}details[open].hist>summary::before,details[open].adj>summary::before{content:"▾ "}
details.adj{font-size:13px;border-left:3px solid var(--accent);padding:2px 8px}
details.adj p{margin:4px 0;white-space:pre-wrap}
.hs{border-top:1px solid var(--line);padding:6px 0}.hs>summary{color:var(--ink)!important;font-size:13px!important}
.hs ul{margin:4px 0 2px;padding-left:18px;font-size:13px}
.info{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;padding:0 6px;margin-left:6px;cursor:pointer;vertical-align:middle}
.pinfo{position:relative;z-index:1;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px;margin-top:-12px;box-shadow:0 -30px 30px var(--bg)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:var(--surface)}
.kv div{padding:10px 12px;border-right:1px solid var(--line)}.kv div:last-child{border-right:0}
.kv span{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv b{font-family:var(--display);font-size:24px;font-weight:700}
.tbl{background:var(--surface);border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;table-layout:fixed}
.tbl td,.tbl th{overflow-wrap:anywhere}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--soft)}
.tbl td.num{font-family:var(--mono)}
.goal{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}
.goal .gh{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-weight:600}
.goal .gh span{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--muted)}
.bar{height:8px;background:var(--soft);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--olive)}
.md h4{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px;color:var(--olive)}
.md ul{margin:4px 0;padding-left:18px;display:grid;gap:5px}.md p{margin:6px 0}
/* progreso */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--olive);stroke-width:2}
.chart .pt{fill:var(--accent);stroke:var(--ink);stroke-width:1}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .br{fill:var(--olive)}
/* temporada */
.tcover{flex-direction:column;justify-content:flex-start;gap:0;background:radial-gradient(ellipse at 50% 30%,#2a3322 0%,#141714 75%)}
.tcover .cn{position:relative;left:auto;right:auto;top:auto;align-self:stretch;padding:14px 16px 0;font-size:clamp(44px,14vw,100px)}
.tcover .cn small{font-size:11.5px;max-width:90%;line-height:1.4}
.lanes{position:relative;z-index:1;width:100%;display:grid;gap:14px;padding:0 10px;margin-top:auto;margin-bottom:auto}
.lane .lh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:#e9ece6;margin:0 2px 4px}
.lane .lh span{font-family:var(--mono);font-size:12px;font-weight:500;color:#f2c200;text-transform:none}
.track{position:relative;width:100%;aspect-ratio:5/1;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.track .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.track .sp{position:absolute;bottom:3%;height:66%;width:auto;image-rendering:pixelated;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.tip{display:none;margin-top:6px;font-size:13px;color:#e9ece6;background:rgba(20,23,20,.9);border-left:3px solid #f2c200;padding:6px 10px}
.tip.on{display:block}.tip span{color:#a9b98c}

.tsec{display:grid;gap:10px}
.tsh{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:10px;margin-top:6px}
.tsh span{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--accent);color:var(--accent-ink);padding:2px 6px}
.hitos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hito{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--olive);padding:10px;display:grid;gap:2px;min-width:0}
.hito:last-child{border-top-color:var(--accent)}
.hito .hn{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;line-height:1.05}
.hito .hd{font-family:var(--mono);font-size:12px;color:var(--muted)}.hito .hd b{font-family:var(--display);font-size:34px;font-weight:800;color:var(--ink);line-height:1}
.hito .hf{font-size:12px}.hito .hs2{font-size:11.5px;color:var(--muted)}
.blq{display:grid;gap:10px}.blq .bh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.blq .bn{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1.05}
.semanas{display:grid;gap:8px}
.sem{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);padding:10px 12px;display:grid;gap:3px}
.sem.cur{border-left-color:var(--accent);background:var(--soft)}
.sem .sn2{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}
.sem em,.fase em{font-style:normal;font-family:var(--mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);padding:1px 6px;margin-left:6px;vertical-align:middle}
.sem .sf{font-family:var(--mono);font-size:12px;color:var(--muted)}.sem .sfo{font-size:14px}
.sem .sb{display:flex;gap:8px;align-items:center;margin-top:4px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--olive);color:var(--olive);padding:1px 8px}
.linea{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.fase{position:relative;padding:4px 0 16px 18px;display:grid;gap:3px}
.fase::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.fase.cur::before{background:var(--accent);border-color:var(--accent)}.fase.pas{opacity:.55}
.fase .fd{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fase .fn{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.1}
.fase .ffo{font-size:14px}.fase .pk{font-size:13px;color:var(--muted)}.fase .why{justify-self:start;margin-top:2px}
/* control */
.beta{font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);padding:6px 10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:grid;gap:3px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.fgrid .full{grid-column:1/-1}

.gg .hv{font-style:normal;font-weight:600}.hv.ok{color:var(--ok)}.hv.mid{color:var(--warn)}.hv.bad{color:var(--bad)}

.gacts{font-size:13.5px}
/* subapartados de Progreso */
.subsw{position:sticky;top:var(--hh,52px);z-index:5;margin:-12px calc(-1*max(14px,env(safe-area-inset-left))) 0;padding:8px max(14px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line)}
.subsw .seg{flex-wrap:nowrap}.subsw .seg button{padding:8px 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.subsw + .cover{margin-top:-12px;top:calc(var(--hh,52px) + 51px);height:calc(100svh - 52px - 51px - var(--navh) - env(safe-area-inset-bottom))}

.sc{background:var(--surface);border:1px solid var(--line);padding:12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:grid;gap:2px;align-content:start;min-width:0}
.sc.full{grid-column:1/-1}.sc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sc .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sc .v{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05}.sc .v small{font-size:14px;font-weight:600;margin-left:3px}
.sc .s{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.45}
.pbar{height:6px;background:var(--line);margin:6px 0 2px;position:relative;overflow:hidden}.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--olive)}.pbar i.ok{background:var(--ok)}
.stk{display:flex;height:10px;margin:8px 0 4px;overflow:hidden}.stk i{display:block;height:100%}
.f-pro{background:#3b4a2a}.f-rem{background:#8aa060}.f-lig{background:#c8d4ad}.f-des{background:var(--warn)}
.e-rep{background:#5d8bb0}.e-baj{background:#e8b04a}.e-med{background:#e07a2a}.e-alt{background:#c0392b}

.trend .seg{margin:6px 0 8px;max-width:180px}.chart .mt{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.chart .br.hoy{fill:var(--accent)}
/* biblioteca y edición de sesiones */
.ex.quit .nm s{color:var(--muted)}.ex.quit .pl{color:var(--warn)}
.ed{margin:4px 0 6px}.ed button{font-size:11.5px;color:var(--muted)}

.bi .bc{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;padding:2px 8px;cursor:pointer}

<body>

<div class="menu" id="menu"><div class="pan"><h3>Menú</h3><button id="bBib">▤&nbsp; Biblioteca de ejercicios</button><button id="bSync">⟳&nbsp; Actualizar datos</button><button id="bCfg">⚙&nbsp; Ajustes</button><div class="st2">Estado: <span id="sync">—</span></div></div></div>

 <div class="nav"><button id="prev">◀</button><div class="d" id="dTitle"></div><button id="next">▶</button></div>

 <button data-v="entreno" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Entreno</button>
 <button data-v="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v7M5 11h14M12 16l-4 6M12 16l4 6"/></svg>Perfil</button>
 <button data-v="progreso"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/><circle cx="19" cy="6" r="1.2"/></svg>Progreso</button>
 <button data-v="salud"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Salud</button>
 <button data-v="control"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Control</button>

<dialog id="cfg">
 <h2 style="margin-top:0;font-family:var(--display);text-transform:uppercase">Ajustes</h2>
 <label class="nt">Token de GitHub (solo acceso a hyrox-datos)</label>
 <input id="cTok" type="password" autocomplete="off">
 <label class="nt">Repositorio de datos</label>
 <input id="cRepo" placeholder="usuario/repositorio">
 <div class="state" id="cMsg"></div>
 <div class="btns"><button id="cTest">Probar y guardar</button><button id="cClose">Cerrar</button></div>
</dialog>
<dialog class="xp" id="xp"><div class="xph"><div><small id="xps"></small><h3 id="xpt"></h3></div><button type="button" id="xpc">Cerrar</button></div><div class="xpb" id="xpb"></div></dialog>

<script>
"use strict";
/* ================= almacenamiento local ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const cfg = LS.get("cfg", {token:"", repo:"juantv05/hyrox-datos", rama:"main"});
let plan = LS.get("plan", {});          // fecha -> día del plan
let meta = LS.get("meta", {});          // plan/meta.json
let perfil = LS.get("perfil", null);    // plan/perfil.json
let biblio = LS.get("biblio", []);      // plan/ejercicios.json (fichas)
let regs = LS.get("regs", {});          // fecha -> registro propio
let hist = LS.get("hist", {});          // fecha -> registro bajado de GitHub
let cola = LS.get("cola", []);
let ctrl = LS.get("ctrl", {diario:{}, semanal:{}});   // control (beta, solo en el móvil)
let garmin = LS.get("garmin", {}), gsha = LS.get("gsha", {});   // garmin/AAAA-MM-DD.json (lo escribe GitHub Actions)
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
let fecha = hoyISO();
let vista = LS.get("vista", "entreno");
let abierto = {}, irA = null;

/* ================= qué se registra ================= */
const REGISTRABLE = new Set(["fuerza","isometrico","acarreo","test"]);
const esMovilidad = e => e.modo === "continuo" && e.categoria === "complemento";
const registrable = e => REGISTRABLE.has(e.modo) || esMovilidad(e);
const sesionRegistrable = s => s.estructurado && (s.ejercicios||[]).some(registrable);

/* ================= GitHub ================= */
const API = p => `https://api.github.com/repos/${cfg.repo}/contents/${p}`;
async function gh(path, opt={}){
  const r = await fetch(API(path) + (opt.method ? "" : `?ref=${cfg.rama}`), {
    method: opt.method || "GET",
    headers: Object.assign({Authorization:`Bearer ${cfg.token}`, "X-GitHub-Api-Version":"2022-11-28",
      Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json"}, opt.body ? {"Content-Type":"application/json"} : {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined, cache:"no-store"
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return opt.raw ? r.text() : r.json();
}
const b64 = s => { const b = new TextEncoder().encode(s); let t = ""; b.forEach(x => t += String.fromCharCode(x)); return btoa(t); };
async function bajarPlan(){
  const idx = JSON.parse(await gh("plan/indice.json", {raw:true}));
  const nuevo = {};
  await Promise.all(idx.fechas.map(async f => { nuevo[f] = JSON.parse(await gh(`plan/${f}.json`, {raw:true})); }));
  plan = nuevo; LS.set("plan", plan);
  const [m, p, bj] = await Promise.all([gh("plan/meta.json", {raw:true}), gh("plan/perfil.json", {raw:true}), gh("plan/ejercicios.json", {raw:true})]);
  if (bj){ biblio = JSON.parse(bj).fichas || []; LS.set("biblio", biblio); }
  if (m){ meta = JSON.parse(m); LS.set("meta", meta); }
  if (p){ perfil = JSON.parse(p); LS.set("perfil", perfil); }
  LS.set("planAt", Date.now());
}
async function bajarHistorial(){
  const lista = await gh("registros");
  if (!Array.isArray(lista)) return;
  const fs = lista.map(x => x.name).filter(n => /^\d{4}-\d\d-\d\d\.json$/.test(n)).map(n => n.slice(0,10));
  await Promise.all(fs.map(async f => {
    if (cola.includes(f)) return;
    const t = await gh(`registros/${f}.json`, {raw:true});
    if (t) hist[f] = JSON.parse(t);
  }));
  LS.set("hist", hist);
}
async function subir(f){
  let path, cont, msg;
  if (f.startsWith("control/")){ const [, g, d] = f.split("/"); path = `${f}.json`; cont = (ctrl[g] || {})[d] || {}; msg = `Control ${g} ${d}`; }
  else { path = `registros/${f}.json`; cont = regs[f]; msg = `Registro ${f}`; }
  const actual = await gh(path);
  await gh(path, {method:"PUT", body:{message:msg, content:b64(JSON.stringify(cont, null, 1)), branch:cfg.rama, ...(actual && actual.sha ? {sha:actual.sha} : {})}});
}
const encola = k => { if (!cola.includes(k)) cola.push(k); LS.set("cola", cola); pintaSync(); };
async function vaciarCola(){
  if (!cfg.token || !navigator.onLine || !cola.length) return pintaSync();
  for (const f of [...cola]){
    try{ await subir(f); cola = cola.filter(x => x !== f); LS.set("cola", cola);
         if (!f.startsWith("control/") && regs[f]){ Object.values(regs[f].sesiones || {}).forEach(s => { if (s.terminada) s.enviada = true; }); hist[f] = JSON.parse(JSON.stringify(regs[f])); LS.set("regs", regs); LS.set("hist", hist); } }
    catch(e){ break; }
  }
  pintaSync(); pintar();
}
// control: bajar del repositorio (lo pendiente de enviar en el móvil manda)
async function bajarControl(){
  for (const g of ["diario", "semanal"]){
    const lista = await gh(`control/${g}`); if (!Array.isArray(lista)) continue;
    const desde = addD(hoyISO(), -60);
    const fs = lista.map(x => x.name).filter(n => /^\d{4}-\d\d-\d\d\.json$/.test(n)).map(n => n.slice(0,10)).filter(d => d >= desde);
    await Promise.all(fs.map(async d => { if (cola.includes(`control/${g}/${d}`)) return; const t = await gh(`control/${g}/${d}.json`, {raw:true}); if (t) ctrl[g][d] = JSON.parse(t); }));
  }
  LS.set("ctrl", ctrl);
}
// Garmin: solo baja los archivos que han cambiado (compara el sha) de los últimos 60 días
async function bajarGarmin(){
  const lista = await gh("garmin"); if (!Array.isArray(lista)) return;
  const desde = addD(hoyISO(), -60);
  await Promise.all(lista.filter(x => /^\d{4}-\d\d-\d\d\.json$/.test(x.name) && x.name.slice(0,10) >= desde && gsha[x.name] !== x.sha).map(async x => {
    const t = await gh(`garmin/${x.name}`, {raw:true}); if (t){ garmin[x.name.slice(0,10)] = JSON.parse(t); gsha[x.name] = x.sha; } }));
  Object.keys(garmin).forEach(d => { if (d < desde) delete garmin[d]; });
  LS.set("garmin", garmin); LS.set("gsha", gsha);
}
// último valor de Garmin hasta una fecha (p. ej. VO2máx, que solo sale los días que lo mide)
function ultimoG(campo, hasta){ const d = Object.keys(garmin).filter(f => f <= (hasta || "9") && garmin[f][campo] != null).sort().pop(); return d ? {f:d, v:garmin[d][campo]} : null; }
async function sincronizar(){
  if (!cfg.token){ abrirCfg(); return; }
  if (!navigator.onLine){ pintaSync("Sin red"); return; }
  pintaSync("…");
  try{ await vaciarCola(); await bajarPlan(); await Promise.all([bajarHistorial().catch(()=>{}), bajarControl().catch(()=>{}), bajarGarmin().catch(()=>{})]); pintaSync(); pintar(); }
  catch(e){ console.error("sync", e && e.message); pintaSync("Error"); }
}
function pintaSync(txt){
  const el = document.getElementById("sync");
  if (txt){ el.textContent = txt; el.className = ""; return; }
  document.getElementById("bMenu").classList.toggle("pend", cola.length > 0);
  if (cola.length){ el.textContent = `${cola.length} pendiente${cola.length>1?"s":""} de enviar`; el.className = "pend"; }
  else { el.textContent = LS.get("planAt", 0) ? "Al día" : "Sin datos"; el.className = ""; }
}

/* ================= utilidades ================= */
const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIASL = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const dt = f => new Date(f + "T12:00:00");
const iso = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD = (f, n) => { const d = dt(f); d.setDate(d.getDate()+n); return iso(d); };
const fCorta = f => { const d = dt(f); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function md(t){ let o = "", ul = false;
  (t||"").split("\n").forEach(l => { const x = l.trim();
    if (x.startsWith("- ")){ if (!ul){ o += "<ul>"; ul = true; } o += "<li>" + inl(x.slice(2)) + "</li>"; return; }
    if (ul){ o += "</ul>"; ul = false; }
    if (x.startsWith("## ")){ o += `<h4${/revisi/i.test(x) ? ' class="rev"' : ""}>` + inl(x.slice(3)) + "</h4>"; }
    else if (x) o += "<p>" + inl(x) + "</p>"; });
  if (ul) o += "</ul>"; return o; }
const TIPOS = {agm:"AGM", fuerza:"Fuerza", carrera:"Carrera", aerobico:"Aeróbico", hyrox:"Hyrox", recuperacion:"Recuperación", descanso:"Descanso", maniobras:"Maniobras"};
const ORDEN = {"Mañana":0, "Mediodía":1, "Tarde":2, "Noche":3};
const numReps = v => { if (v == null) return null; const m = String(v).match(/\d+/); return m ? +m[0] : null; };
const kgTxt = (kg, tipo) => kg == null ? "" : (tipo === "lastre" ? `+${kg} kg` : `${kg} kg`);
const durTxt = s => s >= 60 ? `${Math.floor(s/60)}'${s%60 ? (s%60)+'"' : ""}` : `${s}"`;
const num = n => String(n).replace(".", ",");
const norm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
// "8,5" -> 8.5 ; vacío -> null ; fuera de 1-10 -> NaN
function leeRPE(v){ v = String(v).trim().replace(",", "."); if (!v) return null; const n = +v; return (isFinite(n) && n >= 1 && n <= 10) ? n : NaN; }

function resumenSeries(e){
  const s = e.series || []; if (!s.length) return "";
  const a = s[0], lado = a.por_lado ? "/lado" : "";
  const carga = a.reps ?? (a.duracion_s ? durTxt(a.duracion_s) : a.distancia_m ? `${a.distancia_m} m` : "");
  const igual = s.every(x => x.kg === a.kg && x.reps === a.reps);
  let t = `${s.length}×${carga}${lado}`;
  if (a.kg != null && igual) t += ` @ ${kgTxt(num(a.kg), a.kg_tipo)}`;
  if (a.rpe_obj) t += ` · RPE ${a.rpe_obj}`;
  if (a.descanso_s) t += ` · desc. ${durTxt(a.descanso_s)}`;
  return t;
}
function resumenContinuo(e){
  const p = [];
  if (e.distancia_km) p.push(`${e.distancia_km} km`);
  if (e.duracion_min) p.push(`${e.duracion_min}'`);
  if (e.fc) p.push(`FC ${e.fc}`);
  if (e.ritmo) p.push(e.ritmo);
  if (e.rpe_obj) p.push(`RPE ${e.rpe_obj}`);
  return p.join(" · ");
}
function resumenRondas(e){
  return `<ul class="list">${e.rondas.map(r => {
    const es = r.estacion, c = r.carrera;
    const det = es.partes ? es.partes.map(p => `${p.nombre} ${p.distancia_m ? p.distancia_m+" m" : ""}${p.reps ? p.reps+" reps" : ""}`).join(" + ")
      : [es.series && `${es.series}×`, es.distancia_m && `${es.distancia_m} m`, es.reps && `${es.reps} reps`, es.kg && `${es.kg} kg`, es.carga, es.ritmo].filter(Boolean).join(" ");
    return `<li>${c ? `${c.distancia_m} m a ${esc(c.ritmo)} → ` : ""}<b>${esc(es.nombre)}</b> ${esc(det)}${es.rpe_obj ? ` · RPE ${es.rpe_obj}` : ""}${es.alternativa ? `<div class="nt">Alternativa: ${esc(es.alternativa)}</div>` : ""}</li>`;
  }).join("")}</ul>${e.objetivo ? `<div class="nt">${esc(e.objetivo)}</div>` : ""}`;
}

/* ================= registro ================= */
function regSesion(f, s){
  regs[f] = regs[f] || (hist[f] ? JSON.parse(JSON.stringify(hist[f])) : {fecha:f, sesiones:{}});
  const r = regs[f].sesiones[s.id] = regs[f].sesiones[s.id] || {titulo:s.titulo, terminada:false, ejercicios:{}};
  s.ejercicios.filter(registrable).forEach(e => {
    if (r.ejercicios[e.id]) return;
    r.ejercicios[e.id] = esMovilidad(e)
      ? {nombre:e.nombre, hecha:false, minutos:e.duracion_min ?? null}
      : {nombre:e.nombre, series:(e.series||[]).map(x => ({n:x.n, kg:x.kg ?? null, reps:numReps(x.reps), duracion_s:x.duracion_s ?? null,

function cargaSemana(){
  const desde = addD(hoyISO(), -6), c = {};
  sesionesTerminadas().filter(x => x.f >= desde && x.f <= hoyISO()).forEach(({f, s}) => {
    ejHechos(s).forEach(x => {
      const nm = norm(x.nombre), m = MAPA.find(([k]) => nm.includes(k)); if (!m) return;
      const series = x.series ? x.series.filter(o => o.hecha).length : (x.hecha ? 1 : 0);
      Object.entries(m[1]).forEach(([mu, w]) => { c[mu] = (c[mu] || 0) + series * w; (c["_ej_" + mu] = c["_ej_" + mu] || new Set()).add(x.nombre); });
    });
  });
  const max = Math.max(1, ...Object.keys(MUSCULOS).map(k => c[k] || 0));
  const out = {}; Object.keys(MUSCULOS).forEach(k => out[k] = {n:(c[k] || 0) / max, series:c[k] || 0, ej:[...(c["_ej_" + k] || [])]});
  return out;
}

function lineChart(pts, o={}){
  if (!pts.length) return "";
  const W = 340, H = 150, L = 34, R = 10, T = 10, B = 22;
  const ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys), pad = (mx - mn) * .15 || 1, y0 = mn - pad, y1 = mx + pad;
  const X = i => L + (pts.length === 1 ? (W-L-R)/2 : i * (W-L-R) / (pts.length-1)), Y = v => T + (1 - (v - y0)/(y1 - y0)) * (H-T-B);
  const ticks = [y0 + (y1-y0)*.15, (y0+y1)/2, y1 - (y1-y0)*.15];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${ticks.map(t => `<line class="gr" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="2" y="${Y(t)+3}">${num(Math.round(t*10)/10)}</text>`).join("")}
    <polyline class="ln" points="${pts.map((p,i) => `${X(i)},${Y(p.y)}`).join(" ")}"/>${pts.map((p,i) => `<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="3.5"/>`).join("")}
    <text x="${L}" y="${H-6}">${fCorta(pts[0].x)}</text>${pts.length > 1 ? `<text x="${W-R}" y="${H-6}" text-anchor="end">${fCorta(pts[pts.length-1].x)}</text>` : ""}</svg>`;
}
function barChart(bars){

  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="gr" x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}"/>${bars.map((b,i) => { const h = (H-B-T) * b.y / mx;
    return `<rect class="br" x="${L + i*bw + 3}" y="${H-B-h}" width="${bw-6}" height="${h}"/><text x="${L + i*bw + bw/2}" y="${H-8}" text-anchor="middle">${esc(b.x)}</text>${b.y ? `<text x="${L + i*bw + bw/2}" y="${H-B-h-3}" text-anchor="middle">${b.y}</text>` : ""}`; }).join("")}</svg>`;
}

/* ================= diálogos y arranque ================= */
const xp = document.getElementById("xp");
function abrirXp(sub, titulo, texto){
  document.getElementById("xps").textContent = sub; document.getElementById("xpt").textContent = titulo; document.getElementById("xpb").innerHTML = md(texto);
  if (xp.showModal){ if (!xp.open) xp.showModal(); } else xp.setAttribute("open", ""); xp.scrollTop = 0;
}
document.getElementById("xpc").onclick = () => xp.close();
xp.addEventListener("close", () => { biblioPick = null; });

/* ================= biblioteca de ejercicios ================= */
const GRUPOS = ["Empuje", "Tracción", "Pierna", "Core", "Acarreos", "Pierna-pie y tendón", "Hyrox", "Movilidad", "Otros"];
let biblioPick = null, biblioQ = "";   // biblioPick: {fecha, sid, eid} si estás eligiendo para una sesión
const xpb = document.getElementById("xpb");
function abrirBiblio(pick){
  biblioPick = pick || null;
  document.getElementById("xps").textContent = pick ? (pick.eid ? "Cambiar ejercicio" : "Añadir ejercicio") : `${biblio.length} fichas`;
  document.getElementById("xpt").textContent = pick ? "Elige de la biblioteca" : "Biblioteca";
  xpb.innerHTML = `<input id="bq" type="search" placeholder="Buscar ejercicio…" autocomplete="off" value="${esc(biblioQ)}"><div id="blist"></div>` +
    (pick ? `<div class="otro"><div class="mm" style="margin-bottom:6px">¿No está en la lista?</div><div class="r2"><input id="botro" placeholder="Nombre del ejercicio"><button data-botro="1">Usar</button></div></div>` : "");
  listaBiblio();
  if (!xp.open) xp.showModal(); xp.scrollTop = 0;
}
function listaBiblio(){
  const q = norm(biblioQ).trim();
  let fs = biblio.filter(f => !q || norm(f.nombre).includes(q) || f.claves.some(k => k.includes(q)) || norm(f.grupo).includes(q));
  if (biblioPick && biblioPick.eid) fs = fs.filter(f => f.modo !== "continuo");   // la movilidad no sustituye a un ejercicio de series
  const h = GRUPOS.map(g => {
    const xs = fs.filter(f => (GRUPOS.includes(f.grupo) ? f.grupo : "Otros") === g).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
    if (!xs.length) return "";
    return `<h4>${esc(g)}</h4><div class="blist">${xs.map(f => `<div class="bi"><button class="bn" data-bf="${esc(f.id)}">${esc(f.nombre)}</button>${biblioPick ? `<button class="bc" data-bver="${esc(f.id)}">cómo</button>` : ""}</div>`).join("")}</div>`;
  }).join("");
  document.getElementById("blist").innerHTML = h || `<p class="nt">Nada con «${esc(biblioQ)}».${biblioPick ? " Escríbelo abajo." : ""}</p>`;
}
function verFicha(f){
  document.getElementById("xps").textContent = f.grupo || "Cómo se hace"; document.getElementById("xpt").textContent = f.nombre;
  xpb.innerHTML = `<button class="bback" data-bback="1">◀ ${biblioPick ? "Volver a elegir" : "Biblioteca"}</button>` +
    md(`## Pasos\n${f.pasos.map(x => "- " + x).join("\n")}\n\n## Claves\n${f.claves_tecnicas.map(x => "- " + x).join("\n")}\n\n## Errores típicos\n${f.errores.map(x => "- " + x).join("\n")}`) +
    (biblioPick ? `<div class="btns" style="margin-top:14px"><button data-bf="${esc(f.id)}">Elegir este ejercicio</button></div>` : "");
  xp.scrollTop = 0;
}
// aplica lo elegido: cambia el ejercicio (guarda cuál era el del plan) o añade uno nuevo con 3 series vacías
function aplicaElegido(nombre, f){
  const pick = biblioPick; xp.close();
  if (!pick || pick.fecha !== fecha || !plan[fecha]) return;
  const s = plan[fecha].sesiones.find(z => z.id === pick.sid); if (!s) return;
  const r = regSesion(fecha, s);
  const modo = f && f.modo ? f.modo : "fuerza", kg_tipo = f && f.kg_tipo ? f.kg_tipo : "kg";
  const campo = modo === "isometrico" ? "duracion_s" : modo === "acarreo" ? "distancia_m" : "reps";
  const vacia = n => ({n, kg:null, reps:null, duracion_s:null, distancia_m:null, rpe:null, hecha:false, plan:null});
  if (pick.eid){
    const x = r.ejercicios[pick.eid]; if (!x) return;
        if (x.sustituye && norm(x.sustituye) === norm(nombre)){ delete r.ejercicios[pick.eid]; regSesion(fecha, s); }
    else {
      if (!x.extra && !x.sustituye) x.sustituye = x.nombre;
      x.nombre = nombre; x.kg_tipo = kg_tipo; x.campo = campo; if (x.extra) x.modo = modo;
      (x.series || []).forEach(o => { if (o.hecha) return; o.kg = null; o.reps = null; o.duracion_s = null; o.distancia_m = null; });   // las cargas del plan eran de otro ejercicio
    }
    abierto[s.id] = pick.eid; irA = pick.eid;
  } else {
    const id = `${s.id}-x${Date.now().toString(36)}`;
    r.ejercicios[id] = modo === "continuo" ? {nombre, extra:true, modo, orden:Date.now(), hecha:false, minutos:null}
      : {nombre, extra:true, modo, kg_tipo, campo, orden:Date.now(), series:[1,2,3].map(vacia)};
    abierto[s.id] = id; irA = id;
  }
  guardar(); render();
}
xpb.addEventListener("input", ev => { if (ev.target.id === "bq"){ biblioQ = ev.target.value; listaBiblio(); } });
xpb.addEventListener("click", ev => {
  const g = sel => ev.target.closest(sel);
  if (g("[data-bback]")){ abrirBiblio(biblioPick); return; }
  const v = g("[data-bver]"); if (v){ verFicha(biblio.find(f => f.id === v.dataset.bver)); return; }
  const b = g("[data-bf]");
  if (b){ const f = biblio.find(z => z.id === b.dataset.bf); if (biblioPick) aplicaElegido(f.nombre, f); else verFicha(f); return; }
  if (g("[data-botro]")){ const n = document.getElementById("botro").value.trim(); if (n) aplicaElegido(n, fichaDe(n)); }
});

menu.onclick = ev => { if (ev.target === menu) menu.classList.remove("on"); };

document.getElementById("bBib").onclick = () => { menu.classList.remove("on"); biblioQ = ""; abrirBiblio(null); };
document.getElementById("cClose").onclick = () => dlg.close();
document.getElementById("cTest").onclick = async () => {
  cfg.token = document.getElementById("cTok").value.trim(); cfg.repo = document.getElementById("cRepo").value.trim();
  const msg = document.getElementById("cMsg"); msg.className = "state"; msg.textContent = "Probando…";

  catch(e){ msg.className = "state pend"; msg.textContent = "No se pudo leer el repositorio (" + e.message + "). Revisa el token y el nombre."; }
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

fijaCab(); window.addEventListener("resize", fijaCab);
irVista(vista); pintaSync();
if (cfg.token) sincronizar();
